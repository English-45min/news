        };

        let currentTab = 'global';

        // 渲染新闻列表（详细解读默认展开）
        function renderNews(tab = 'global', filterKeyword = '') {
            const container = document.getElementById('newsContainer');
            container.innerHTML = '';

            let list = newsData[tab];
            if (filterKeyword) {
                list = list.filter(item => 
                    item.title.includes(filterKeyword) || 
                    item.summary.includes(filterKeyword) ||
                    item.tag.includes(filterKeyword)
                );
            }

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-500 text-xs">没有找到符合关键词的新闻</div>`;
                return;
            }

            list.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-bbCard border border-bbBorder rounded-lg p-4 space-y-2.5 hover:border-bbGold/50 transition duration-150 shadow-sm";
                
                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs">
                        <div class="flex items-center space-x-2">
                            <span class="font-black text-bbGold tracking-wider">${item.id}</span>
                            <span class="bg-gray-800 text-gray-300 px-2 py-0.5 rounded text-[10px] font-medium border border-gray-700">${item.tag}</span>
                        </div>
                        <span class="text-bbTextMuted font-mono text-[11px]"><i class="fa-regular fa-clock"></i> ${item.time}</span>
                    </div>
                    <h3 class="text-sm font-bold leading-snug text-gray-100">
                        ${item.title}
                    </h3>
                    <p class="text-xs text-gray-300 leading-relaxed">
                        ${item.summary}
                    </p>
                    
                    <!-- 详细解读默认自动展开 -->
                    <div class="pt-2.5 border-t border-bbBorder/60 space-y-1.5 text-xs bg-black/20 p-2.5 rounded">
                        <div class="text-gray-300">
                            <span class="text-bbGold font-bold">📌 市场传导影响：</span> ${item.impact}
                        </div>
                        <div class="text-gray-300">
                            <span class="text-blue-400 font-bold">💡 关联资产标的：</span> <span class="font-mono text-gray-200">${item.asset}</span>
                        </div>
                    </div>

                    <div class="pt-0.5 flex justify-between items-center text-[10px] text-bbTextMuted">
                        <span>彭博财经 · 每日精编</span>
                        <span>来源: Bloomberg/公开数据</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 切换 Tab
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.className = "py-2 text-xs font-bold tracking-wider text-gray-400 transition";
            });
            document.getElementById(`tab-${tab}`).className = "py-2 text-xs font-bold tracking-wider tab-active transition";
            document.getElementById('searchInput').value = '';
            renderNews(tab);
        }

        // 搜索过滤
        function filterNews() {
            const kw = document.getElementById('searchInput').value.trim();
            renderNews(currentTab, kw);
        }

        // 切换夜间/亮白主题
        function toggleTheme() {
            const body = document.getElementById('mainBody');
            const icon = document.getElementById('themeIcon');
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                body.classList.add('light');
                icon.className = "fa-solid fa-sun text-yellow-500";
            } else {
                body.classList.remove('light');
                body.classList.add('dark');
                icon.className = "fa-solid fa-moon";
            }
        }

        // 一键生成朋友圈海报
        function generatePoster() {
            const activeList = newsData[currentTab];
            const tabTitle = currentTab === 'global' ? '彭博全球 Top 10' : (currentTab === 'asia' ? '亚太焦点 Top 5' : '国内核心 Top 5');

            const wrapper = document.createElement('div');
            wrapper.style.position = 'absolute';
            wrapper.style.left = '-9999px';
            wrapper.style.width = '375px';
            wrapper.style.backgroundColor = '#0D1117';
            wrapper.style.color = '#FFFFFF';
            wrapper.style.padding = '20px';
            wrapper.style.fontFamily = 'sans-serif';

            let itemsHtml = activeList.map(item => `
                <div style="margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #30363D;">
                    <div style="font-size: 11px; color: #F0B90B; font-weight: bold; margin-bottom: 3px;">${item.id} · ${item.tag}</div>
                    <div style="font-size: 13px; font-weight: bold; line-height: 1.3; margin-bottom: 4px;">${item.title}</div>
                    <div style="font-size: 11px; color: #8B949E; line-height: 1.4; margin-bottom: 4px;">${item.summary}</div>
                    <div style="font-size: 10px; color: #D1D5DB; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 3px;">📌 影响：${item.impact}</div>
                </div>
            `).join('');

            wrapper.innerHTML = `
                <div style="border-bottom: 2px solid #F0B90B; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: border-end;">
                    <div>
                        <div style="background: #F0B90B; color: #000; font-size: 10px; font-weight: 900; display: inline-block; padding: 2px 5px; border-radius: 2px;">BLOOMBERG</div>
                        <div style="font-size: 16px; font-weight: bold; margin-top: 4px;">${tabTitle} 早报看板</div>
                    </div>
                    <div style="font-size: 10px; color: #8B949E; text-align: right;">
                        2026-10-09<br>实时编译
                    </div>
                </div>
                ${itemsHtml}
                <div style="text-align: center; font-size: 10px; color: #8B949E; margin-top: 15px;">
                    长按保存图片 · 彭博财经新闻看板
                </div>
            `;

            document.body.appendChild(wrapper);

            html2canvas(wrapper, { scale: 2, backgroundColor: '#0D1117' }).then(canvas => {
                const renderArea = document.getElementById('posterRenderArea');
                renderArea.innerHTML = '';
                const img = document.createElement('img');
                img.src = canvas.toDataURL('image/png');
                img.style.maxWidth = '100%';
                img.style.borderRadius = '8px';
                renderArea.appendChild(img);
                
                document.body.removeChild(wrapper);
                document.getElementById('posterModal').classList.remove('hidden');
            });
        }

        // 直接复制微信简报文本
        function copyWechatText() {
            const list = newsData[currentTab];
            const tabName = currentTab === 'global' ? '彭博全球 Top 10' : (currentTab === 'asia' ? '亚太焦点 Top 5' : '国内核心 Top 5');
            
            let txt = `【彭博财经看板 · ${tabName}】\n📅 2026-10-09 每日精编\n--------------------------\n\n`;
            list.forEach(item => {
                txt += `${item.id} | ${item.title}\n💡 ${item.summary}\n📌 影响：${item.impact}\n\n`;
            });
            txt += `数据来源：Bloomberg 及公开数据综合编译`;

            navigator.clipboard.writeText(txt).then(() => {
                alert('✅ 简报文本已成功复制到剪贴板！\n您可以直接去微信群或朋友圈粘贴发布。');
            }).catch(() => {
                alert('剪报文本生成成功，请手动截屏或选择文本复制。');
            });
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // 初始化加载
        renderNews('global');
    </script>
</body>
</html>
